[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e-shop-ltap-scenario"
dynamic = ["version"]
description = "What LTAP actually retires from a pipeline inventory: the second-copy rule vs the headline reading vs a name keyword scan, over one worked retail scenario."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Santosh Shinde" }]
requires-python = ">=3.11"
keywords = ["databricks", "ltap", "lakebase", "cdc", "lakehouse", "data-architecture", "postgres", "data-engineering"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "twine>=5.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
]

[project.scripts]
e-shop-ltap = "e_shop_ltap.cli:main"

[project.urls]
Homepage = "https://github.com/santoshshinde2012/e_shop_ltap_scenario"
Repository = "https://github.com/santoshshinde2012/e_shop_ltap_scenario"
Issues = "https://github.com/santoshshinde2012/e_shop_ltap_scenario/issues"

[tool.setuptools.dynamic]
version = { attr = "e_shop_ltap.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
e_shop_ltap = ["data/*.csv", "py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # the report text uses em dashes and arrows on purpose

[tool.ruff.lint.isort]
known-first-party = ["e_shop_ltap"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["e_shop_ltap"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["e_shop_ltap"]
branch = true
omit = ["src/e_shop_ltap/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
